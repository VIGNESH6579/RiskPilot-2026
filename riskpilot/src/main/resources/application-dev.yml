spring:
  datasource:
    url: jdbc:h2:mem:riskpilot-dev
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.riskpilot: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

riskpilot:
  mode: SHADOW
  enforce-strict-timing: true
  account:
    initial-capital: 500000
    risk-per-trade-pct: 1.0
    daily-loss-limit-pct: 2.0
  market:
    open: "09:15"
    close: "15:30"
    zone: Asia/Kolkata
  session:
    entry-start: "09:20"
    last-entry-cutoff: "15:00"
    force-exit: "15:25"
  infra:
    feed:
      transport: WEBSOCKET
      data-source: angelone-live
      real-time-only: true
      startup-fail-fast: false
  risk:
    max-trades-per-day: 2
  execution:
    slippage:
      entry-max: 2.0
    latency:
      soft-block-ms: 500
  notification:
    ntfy-enabled: false


