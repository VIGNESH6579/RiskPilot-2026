spring:
  config:
    activate:
      on-profile: prod

  # ---- Database: PostgreSQL REQUIRED in prod ----
  # start.sh passes the JDBC URL, user, pass via command-line args at startup.
  # Only HikariCP pool tuning lives here; URL/creds come from env vars.
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 60000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: none                # Flyway owns schema; JPA should not validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  # ---- Flyway: ENABLED in prod ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false

  # ---- H2 console: DISABLED in prod ----
  h2:
    console:
      enabled: false

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

# ---- Logging ----
logging:
  level:
    com.riskpilot: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

# ---- RiskPilot mode ----
riskpilot:
  mode: SHADOW
  strict-mode: true
  infra:
    feed:
      real-time-only: true
      data-source: angelone-live
      require-stable: true
    market-data:
      fallback-disabled: true
      mock-disabled: true
  observer:
    internal-port: 8766
