spring:
  config:
    activate:
      on-profile: prod

  # # ---- Database: PostgreSQL REQUIRED in prod ----
  # # start.sh validates DATABASE_URL is set before JVM starts.
  # datasource:
  #   url: ${DATABASE_URL}
  #   driver-class-name: org.postgresql.Driver
  #   username: ${DATABASE_USERNAME}
  #   password: ${DATABASE_PASSWORD}
  #   hikari:
  #     maximum-pool-size: 5          # Render free PG allows max 25 connections
  #     minimum-idle: 2
  #     connection-timeout: 20000
  #     idle-timeout: 300000
  #     max-lifetime: 1200000
  #     keepalive-time: 60000         # Prevent firewall drops on idle connections
  #     connection-test-query: SELECT 1

  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 60000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: none                # Flyway owns schema; JPA should not validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  # ---- Flyway: ENABLED in prod ----
  # BEFORE: always disabled → tables never created on fresh DB.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false

  # ---- H2 console: DISABLED in prod ----
  h2:
    console:
      enabled: false

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never           # Never leak DB credentials in health response

# ---- Logging ----
logging:
  level:
    com.riskpilot: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

# ---- RiskPilot mode ----
riskpilot:
  mode: SHADOW
  strict-mode: true
  infra:
    feed:
      real-time-only: true
      data-source: angelone-live
      require-stable: true
    market-data:
      fallback-disabled: true
      mock-disabled: true
  observer:
    internal-port: 8766
