spring:
  config:
    activate:
      on-profile: prod

  # ---- Database: PostgreSQL REQUIRED in prod ----
  # start.sh passes the JDBC URL, user, pass via command-line args at startup.
  # Only HikariCP pool tuning lives here; URL/creds come from env vars.
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 60000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: none                # Flyway owns schema; JPA should not validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  # ---- Flyway: ENABLED in prod ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false

  # ---- H2 console: DISABLED in prod ----
  h2:
    console:
      enabled: false

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

# ---- Logging ----
logging:
  level:
    com.riskpilot: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

# ---- RiskPilot mode ----
riskpilot:
  mode: SHADOW
  strict-mode: true
  filters:
    # FIX: minOrRange=120 (Java default) silently blocks ALL trades on low-volatility days
    # (e.g. pre-expiry, holiday-shortened sessions) where NIFTY OR is < 120 pts.
    # Lowered to 60 for prod/paper so days with 60-120pt OR still trade.
    # Set to 120 again if you want conservative filtering; set to 0 to disable entirely.
    min-or-range: 60
  risk:
    max-trades-per-day: 10         # Paper/shadow mode cap: up to 20 via RiskGateEngine
                                   # Override at runtime: set MAX_TRADES_PER_DAY env var in Render
                                   # Hard cap enforced by RiskGateEngine: 20 (shadow), 5 (live)
    one-trade-at-a-time: true
    max-daily-loss-r: 5.0          # Stop trading after -5R loss on the day (paper mode)
    max-consecutive-losses: 5      # Stop after 5 losses in a row (paper mode)
  time-phase:
    late:
      start: "13:30"
      end: "15:30"
      allow-new-trades: true       # FIX: Allow new trades in late session for paper trading
      force-exit: false            # FIX: Do NOT force-exit open trades at 13:30 in paper mode
  infra:
    feed:
      real-time-only: true
      data-source: angelone-live
      require-stable: true
    market-data:
      fallback-disabled: true
      mock-disabled: true
  observer:
    internal-port: 8766
