server:
  port: 8080

spring:
  application:
    name: riskpilot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:riskpilot}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:password}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
  websocket:
    message-broker:
      application-prefix: /app
      user-prefix: /user
  jackson:
    time-zone: Asia/Kolkata
    date-format: yyyy-MM-dd HH:mm:ss

riskpilot:
  mode: ${RISKPILOT_MODE:SHADOW}
  strict-mode: true
  enforce-strict-timing: ${RISKPILOT_ENFORCE_STRICT_TIMING:true}
  market:
    open: ${MARKET_OPEN:09:15}
    close: ${MARKET_CLOSE:15:30}
    zone: ${MARKET_ZONE:Asia/Kolkata}
  instrument:
    symbol: ${TRADING_SYMBOL:NIFTY}
    lot-size: ${INSTRUMENT_LOT_SIZE:75}
    point-value: ${INSTRUMENT_POINT_VALUE:50.0}
  account:
    initial-capital: ${ACCOUNT_INITIAL_CAPITAL:500000}
    risk-per-trade-pct: ${ACCOUNT_RISK_PER_TRADE_PCT:1.0}
    daily-loss-limit-pct: ${ACCOUNT_DAILY_LOSS_LIMIT_PCT:2.0}
    size-reduction-after-losses: ${ACCOUNT_SIZE_REDUCTION_AFTER_LOSSES:2}
    reduced-risk-factor: ${ACCOUNT_REDUCED_RISK_FACTOR:0.5}
  session:
    timezone: ${TRADING_TIMEZONE:Asia/Kolkata}
    start: ${SESSION_START:09:15}
    end: ${SESSION_END:15:30}
    entry-start: ${SESSION_ENTRY_START:09:20}
    last-entry-cutoff: ${SESSION_LAST_ENTRY_CUTOFF:15:00}
    force-exit: ${SESSION_FORCE_EXIT:15:25}
    opening-range-end: ${OPENING_RANGE_END:09:45}
  filters:
    regime-required: TREND_ONLY
    min-or-range: 120
    max-spread: 2.0
  time-phase:
    early:
      start: "09:15"
      end: "12:00"
      position-scale: 1.0
    mid:
      start: "12:00"
      end: "13:30"
      position-scale: 0.35
    late:
      start: "13:30"
      end: "15:30"
      allow-new-trades: false
      force-exit: true
  risk:
    max-trades-per-day: ${MAX_TRADES_PER_DAY:100}
    one-trade-at-a-time: true
    max-daily-loss-r: 1.5
    max-consecutive-losses: 3
  execution:
    slippage:
      entry-max: ${SLIPPAGE_ENTRY:2.0}
      tp1-max: 3.0
      runner-max: 6.0
      panic-exit-max: 8.0
    latency:
      soft-block-ms: 500
      hard-block-ms: 1500
      panic-ms: 5000
    simulation:
      entry-latency-min-ms: ${EXECUTION_ENTRY_LATENCY_MIN_MS:50}
      entry-latency-max-ms: ${EXECUTION_ENTRY_LATENCY_MAX_MS:300}
      exit-latency-min-ms: ${EXECUTION_EXIT_LATENCY_MIN_MS:50}
      exit-latency-max-ms: ${EXECUTION_EXIT_LATENCY_MAX_MS:250}
      spread-min-points: ${EXECUTION_SPREAD_MIN_POINTS:0.5}
      spread-max-points: ${EXECUTION_SPREAD_MAX_POINTS:2.0}
      slippage-min-points: ${EXECUTION_SLIPPAGE_MIN_POINTS:0.1}
      slippage-max-points: ${EXECUTION_SLIPPAGE_MAX_POINTS:3.0}
      volatility-weight: ${EXECUTION_VOLATILITY_WEIGHT:0.08}
      tick-speed-weight: ${EXECUTION_TICK_SPEED_WEIGHT:0.35}
    reject-on-high-slippage: true
    reject-on-latency-breach: true
  infra:
    feed:
      require-stable: true
      max-missing-ticks: 3
      instability-timeout-sec: 15
      real-time-only: true
      data-source: angelone-live
      transport: WEBSOCKET
      max-source-age-ms: ${FEED_MAX_SOURCE_AGE_MS:1500}
      max-clock-skew-ms: ${FEED_MAX_CLOCK_SKEW_MS:2000}
      startup-valid-tick-timeout-ms: ${FEED_STARTUP_VALID_TICK_TIMEOUT_MS:10000}
      startup-fail-fast: ${FEED_STARTUP_FAIL_FAST:true}
    heartbeat:
      enabled: true
      panic-exit-on-failure: true
      timeout-sec: 30
      max-silence-ms: 3000
  notification:
    ntfy-enabled: ${NTFY_ENABLED:false}
    ntfy-topic: ${NTFY_TOPIC:riskpilot_shadow_alerts}
    ntfy-cooldown-sec: ${NTFY_COOLDOWN_SEC:10}

angelone:
  api-key: ${ANGELONE_API_KEY:}
  client-code: ${ANGELONE_CLIENT_CODE:}
  password: ${ANGELONE_PASSWORD:}
  totp-secret: ${ANGELONE_TOTP_SECRET:}
  base-url: ${ANGELONE_BASE_URL:https://apiconnect.angelbroking.com}

logging:
  level:
    com.riskpilot: ${LOG_LEVEL:INFO}
    org.springframework.web: ${WEB_LOG_LEVEL:WARN}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/riskpilot.log}
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
