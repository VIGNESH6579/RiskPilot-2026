services:
    - type: web
      name: riskpilot-2026
      env: docker
      plan: free
      dockerfilePath: ./riskpilot/Dockerfile
      dockerContext: ./riskpilot
      autoDeploy: true

      # /actuator/health is security-permitted and always returns 200
      healthCheckPath: /actuator/health
      healthCheckTimeout: 300
      healthCheckInterval: 60

      startCommand: "./start.sh"

      envVars:
        - key: JAVA_OPTS
          value: "-Xms256m -Xmx512m -XX:+UseG1GC"
        - key: SPRING_PROFILES_ACTIVE
          value: prod
        - key: OBSERVER_PORT
          value: "8765"
        - key: ANGEL_INDIA_VIX_TOKEN
          value: "999920005"
        - key: ANGEL_INDIA_VIX_EXCHANGE
          value: "NSE"
        # BUG-FIX: NIFTY weekly expiry is THURSDAY, not TUESDAY
        - key: NIFTY_WEEKLY_EXPIRY_DAY
          value: "THURSDAY"
        - key: NSE_TRADING_HOLIDAYS
          value: "2026-01-26,2026-02-26,2026-03-20,2026-03-31,2026-04-02,2026-04-03,2026-04-14,2026-05-01,2026-08-15,2026-10-02,2026-11-02,2026-11-03,2026-12-25"
        # BUG-FIX: Added missing ntfy observer env vars required by observer.py
        - key: RISKPILOT_NTFY_TOPIC
          value: "riskpilot-live-signals"
        - key: RISKPILOT_ENABLE_NTFY
          value: "true"
        - key: DATABASE_URL
          sync: false
        - key: DATABASE_USERNAME
          sync: false
        - key: DATABASE_PASSWORD
          sync: false
        - key: ADMIN_USERNAME
          sync: false
        - key: ADMIN_PASSWORD
          sync: false
        - key: ANGEL_API_KEY
          sync: false
        - key: ANGEL_CLIENT_ID
          sync: false
        - key: ANGEL_PIN
          sync: false
        - key: ANGEL_TOTP_SECRET
          sync: false
        - key: ANGEL_CLIENT_PUBLIC_IP
          sync: false
