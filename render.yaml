services:
  - type: web
    name: riskpilot-2026
    env: docker
    plan: free
    dockerfilePath: ./riskpilot/Dockerfile
    dockerContext: ./riskpilot
    autoDeploy: true

    healthCheckPath: /actuator/health
    healthCheckTimeout: 300
    healthCheckInterval: 60

    envVars:
      - key: PORT
        value: "10000"

      # JVM — tuned for 512 MB Render container
      - key: JAVA_OPTS
        value: "-Xms64m -Xmx256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom"

      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # FIX: Explicitly set trading symbol so all @Value("${TRADING_SYMBOL:NIFTY}") annotations
      # are consistent with application.yml symbol config.
      - key: TRADING_SYMBOL
        value: "NIFTY"

      # CORS — must match your actual Render service URL exactly
      - key: CORS_ALLOWED_ORIGINS
        value: "https://riskpilot-2026.onrender.com"

      # Trading config
      - key: NIFTY_WEEKLY_EXPIRY_DAY
        value: "THURSDAY"
      - key: ANGEL_INDIA_VIX_TOKEN
        value: "999920005"
      - key: ANGEL_INDIA_VIX_EXCHANGE
        value: "NSE"

      # Notifications
      - key: RISKPILOT_NTFY_TOPIC
        value: "riskpilot-live-signals"
      - key: RISKPILOT_ENABLE_NTFY
        value: "true"

      # TrapEngine sizing — configurable without code changes
      - key: TRAP_ACCOUNT_CAPITAL
        value: "100000"
      - key: TRAP_RISK_PCT
        value: "0.01"

      # ---- SECRETS: set these in Render Dashboard → Environment tab ----
      # Never commit values here.

      # Admin API credentials
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # PostgreSQL — linked from the database below via fromDatabase.
      - key: DATABASE_URL
        fromDatabase:
          name: riskpilot-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: riskpilot-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: riskpilot-db
          property: password

      # Angel One broker credentials
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_CLIENT_ID
        sync: false
      - key: ANGEL_PIN
        sync: false
      - key: ANGEL_TOTP_SECRET
        sync: false
      - key: ANGEL_CLIENT_PUBLIC_IP
        sync: false

      # Observer WebSocket auth (random string, 32+ chars)
      - key: OBSERVER_SECRET
        sync: false

      # Optional: ntfy.sh access token for private ntfy topics
      - key: RISKPILOT_NTFY_AUTH_TOKEN
        sync: false

databases:
  - name: riskpilot-db
    plan: free
    # ⚠️  If your existing PostgreSQL (created manually in the Render Dashboard)
    # was NOT created via this render.yaml, do NOT add it here — that would create
    # a second DB. Instead, go to Dashboard → riskpilot-2026 web service →
    # Environment → Link Database and select your existing database.
    # Uncomment the lines below ONLY if deploying fresh with no existing DB.
    # databaseName: riskpilot
    # user: riskpilot
