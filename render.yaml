services:
  - type: web
    name: riskpilot-2026
    env: docker
    plan: free
    dockerfilePath: ./riskpilot/Dockerfile
    dockerContext: ./riskpilot
    autoDeploy: true

    healthCheckPath: /actuator/health
    healthCheckTimeout: 300
    healthCheckInterval: 60
    # Render free tier requires port to be detected or specified.
    # The start.sh script uses the $PORT env var provided by Render.
    # NOTE: startCommand is intentionally omitted — Dockerfile ENTRYPOINT ["./start.sh"] is used.
    # Setting startCommand here would pass it as an argument to the ENTRYPOINT, not override it.

    envVars:
      - key: PORT
        value: "10000"

      # JVM — tuned for 512 MB Render container
      - key: JAVA_OPTS
        value: "-Xms64m -Xmx256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom"

      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # CORS — must match your actual Render service URL exactly
      - key: CORS_ALLOWED_ORIGINS
        value: "https://riskpilot-2026.onrender.com"

      # Trading config
      - key: NIFTY_WEEKLY_EXPIRY_DAY
        value: "THURSDAY"
      - key: ANGEL_INDIA_VIX_TOKEN
        value: "999920005"
      - key: ANGEL_INDIA_VIX_EXCHANGE
        value: "NSE"

      # Notifications
      - key: RISKPILOT_NTFY_TOPIC
        value: "riskpilot-live-signals"
      - key: RISKPILOT_ENABLE_NTFY
        value: "true"

      # ---- SECRETS: set these in Render Dashboard → Environment tab ----
      # Never commit values here.

      # Admin API credentials
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # PostgreSQL — REQUIRED in prod.
      # SETUP: In Render Dashboard → your web service → Environment → Link your PostgreSQL database.
      # If using "Link database" in the dashboard, DATABASE_URL is injected automatically.
      # The internal DATABASE_URL format is: postgres://user:pass@dpg-xxx-a:5432/dbname
      # ⚠️  DATABASE_URL must be set or the app will refuse to start in prod mode.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

      # Angel One broker credentials
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_CLIENT_ID
        sync: false
      - key: ANGEL_PIN
        sync: false
      - key: ANGEL_TOTP_SECRET
        sync: false
      - key: ANGEL_CLIENT_PUBLIC_IP
        sync: false

      # Observer WebSocket auth (random string, 32+ chars)
      - key: OBSERVER_SECRET
        sync: false

      # Optional: ntfy.sh access token for private ntfy topics
      - key: RISKPILOT_NTFY_AUTH_TOKEN
        sync: false
